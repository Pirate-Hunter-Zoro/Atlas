# The one Python file here is slurm_jobs/p0/bench_tier1.py, the concurrency harness
# t8b_tier1_1gpu.sbatch drives against an OpenAI-shaped endpoint. It needs aiohttp
# and a tokenizer, which the Mac can hold; the server it measures is vLLM, which
# only the cluster can (README: vLLM 0.29.0 in the vllm_env conda prefix, which the
# sbatch files still activate). No tests: the check is that the harness compiles
# and its imports resolve.
[project]
name = "libr-local-llm"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = [
    "aiohttp",
    "transformers",
]

[project.optional-dependencies]
cluster = ["vllm==0.29.0; sys_platform == 'linux'"]

[tool.uv]
package = false
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
