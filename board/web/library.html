<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Board">
<title>Library</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="/icon-192.png">
<link rel="stylesheet" href="/static/typeface.css">
<!-- The board's own sheet, for the palette, the dark mode and the reading face.
     A second set of colours for a second page is two sets to keep in step, and
     this page is read in the same room, on the same glass, as the lesson. -->
<link rel="stylesheet" href="/static/board.css">
<link rel="stylesheet" href="/static/library.css">
<script src="/static/typeface.js" defer></script>
</head>
<body>

<!-- A PAGE, NOT A PANEL OVER THE LESSON. Everything here is about documents
     this workspace has written, and none of it touches the sitting on the
     board: feedback lands beside the document it is about and wakes a turn of
     its own. So the two ways out are the two other surfaces, on one row. -->
<header id="libbar">
  <a id="lib-back" href="/board" title="back to the lesson">‹ board</a>
  <a id="lib-map" href="/board?map=1" title="the map of this workspace">◈ map</a>
  <strong id="lib-where"></strong>
  <span id="lib-count" class="muted"></span>
</header>

<main id="library">
  <p id="lib-none" class="lib-none" hidden></p>
  <div id="lib-list"></div>
</main>

<!-- One document, read on the glass. The pages are PNGs drawn by the machine
     that holds the PDF, for every reason `course/paper.py` gives: iOS renders a
     PDF in a frame as one unscrollable page, and navigating to one in a
     standalone app is a page with no way back. -->
<div id="reader" hidden>
  <div id="reader-bar">
    <strong id="reader-name"></strong>
    <span id="reader-sub" class="muted"></span>
    <!-- THE PEN, ON THE PAGE ITSELF. A ring round a figure at 200% zoom is a
         complaint already located, and the alternative was to draw it on the
         board's own viewer and then write the note on a different surface. -->
    <button id="reader-pen" type="button" title="draw on the page">✎ mark it up</button>
    <button id="reader-say" type="button">say what is wrong</button>
    <button id="reader-close" type="button" title="back to the library">✕</button>
  </div>
  <!-- NOTHING THE READER CAN BE WAITING ON IS SILENT. A revision was dispatched
       in the same request that filed the note, and the only thing that used to
       change on the glass was a line saying the note was filed. This says the
       turn is running, and it says afterwards when the ink on the page was
       drawn on a version with a different number of pages in it. -->
  <p id="reader-said" class="reader-said" hidden></p>
  <div id="reader-pages"></div>
</div>

<!-- FEEDBACK, AND IT IS NEVER JUST FILED. It lands beside the document, dated
     and versioned, and the same request asks for the revision -- a note nothing
     acts on is a note somebody believes is in force. A page number rides with
     it because the reader is looking at a page when they write it. -->
<div id="note" hidden>
  <div id="note-box">
    <strong id="note-title"></strong>
    <p id="note-where" class="muted"></p>
    <!-- TWO ASKS, FROM ONE PANEL. A correction keeps the document's structure,
         its names for things and its claims -- which is right for "figure 3 is
         mislabelled" and wrong for "that presentation needs an overhaul now
         that we plan to use colibrì". The prompt a correction is woken with
         says outright *do not start it again and do not widen it*, so without
         this the only route to an overhaul was a terminal. -->
    <div id="note-ask">
      <button id="ask-revise" type="button" class="on">fix what is wrong</button>
      <button id="ask-rework" type="button">it needs an overhaul</button>
    </div>
    <textarea id="note-text" rows="7"
      placeholder="What is wrong with it, and what should it say instead."></textarea>
    <!-- AN OVERHAUL COSTS A PURPOSE. Restructuring, cutting and rewriting with
         no new purpose named is a rewrite for its own sake, so this sentence is
         required and is what the turn works to. -->
    <div id="note-purpose-box" hidden>
      <p class="muted">It may restructure, cut, reorder and rewrite. Say what the
        document is <strong>for</strong> now — that sentence outranks the shape
        it presently has.</p>
      <textarea id="note-purpose" rows="3"
        placeholder="What this document is for now, and who reads it."></textarea>
    </div>
    <p id="note-page" class="muted" hidden></p>
    <!-- INK COUNTS AS SAYING SOMETHING. A ring round a figure is a complaint,
         and a send button that stays dead until somebody types is the board
         asking them to write out what they have already drawn. -->
    <p id="note-marks" class="muted" hidden></p>
    <p id="note-said" class="note-said" hidden></p>
    <div id="note-acts">
      <button id="note-cancel" type="button" class="quiet">cancel</button>
      <button id="note-send" type="button" class="primary" disabled>send it</button>
    </div>
  </div>
</div>

<!-- WHAT A ROUND ACTUALLY DID. The turn writes `## What was changed` at the
     bottom of the feedback file, and that is the answer to *did it do what I
     asked* -- in a file the iPad cannot open. The rounds under a document are
     tappable and this is what opens. -->
<div id="round" hidden>
  <div id="round-box">
    <strong id="round-title"></strong>
    <div id="round-list"></div>
    <pre id="round-text"></pre>
    <div id="round-acts">
      <button id="round-close" type="button" class="quiet">close</button>
    </div>
  </div>
</div>

<!-- The ink, and the clipboard it shares with the lesson's own pen. Both are
     the board's, unchanged: a page of a document carries `data-ann` and
     `annotate.js` has taken that as an anchor since the viewer first drew one.
     Not deferred -- `library.js` asks for `window.Annotate` as it draws. -->
<script src="/static/ink-clip.js"></script>
<script src="/static/annotate.js"></script>
<script src="/static/library.js"></script>
</body>
</html>
