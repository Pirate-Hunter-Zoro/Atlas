<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Board">
<meta name="theme-color" content="#101114">
<title>Slate</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="/icon-192.png">
<link rel="stylesheet" href="/static/typeface.css">
<link rel="stylesheet" href="/static/slate.css">
<script src="/static/typeface.js" defer></script>
</head>
<!-- face is applied before anything paints -->
<body>

<!-- The way off this page. -->
<div id="away">
  <a id="back" href="/board" title="back to the board">‹ board</a>
  <!-- A NOTES CANVAS (a session whose view is slate): its title, and End,
       after a second tap, which has the tutor transcribe these pages into
       notes.md and build it. -->
  <span id="notes-name" hidden></span>
  <button id="notes-end" type="button" hidden
          title="end the notes: the tutor transcribes these pages into notes.md">End</button>
</div>
<!-- A NOTES CANVAS BOUND TO NOTHING asks at End where its notes go, in the
     one picker order: Random lessons, Recent, Courses, Projects, and a new
     one. A tap ends it into that subject (POST /end {subject}); "keep it
     unfiled" ends it with no turn, the pages left in the session. -->
<div id="notes-send" class="notes-send" hidden>
  <p class="notes-send-head">Send these notes to a course or project, then end</p>
  <div id="notes-send-list"></div>
  <div class="notes-send-new">
    <button id="notes-new-course" type="button">+ new course</button>
    <button id="notes-new-project" type="button">+ new project</button>
  </div>
  <div id="notes-send-form" class="notes-send-form" hidden>
    <input id="notes-send-name" type="text" autocomplete="off" placeholder="name">
    <div id="notes-send-phi" class="notes-send-phi" hidden>
      <span>Patient data?</span>
      <button id="notes-phi-no" type="button">no</button>
      <button id="notes-phi-yes" type="button">yes</button>
    </div>
    <button id="notes-send-go" type="button">make it, send them there and end</button>
  </div>
  <div class="notes-send-acts">
    <button id="notes-send-skip" type="button"
            title="end with no turn; the pages stay in the session">keep it unfiled</button>
    <button id="notes-send-back" type="button">not yet</button>
  </div>
  <p id="notes-send-said" class="notes-send-said"></p>
</div>
<div id="prompt" hidden><span class="kind"></span><span class="text"></span></div>
<div id="slate"></div>

<!-- The clipboard is shared with the board's own writing surface and with the
     marks on the lesson, so copying here and pasting there is one clipboard and
     not three. Before slate-core.js, which reads it. -->
<script src="/static/ink-clip.js"></script>
<!-- What the hand is doing, and where the view is allowed to be. Read by
     slate-core.js and by the map; before both. -->
<script src="/static/plane-core.js"></script>
<!-- The geometry of a line of ink. Before slate-core.js, which reads it and
     refuses to load without it. -->
<script src="/static/ink-core.js"></script>
<script src="/static/slate-core.js"></script>
<script src="/static/slate.js"></script>
</body>
</html>
