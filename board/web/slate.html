<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Board">
<meta name="theme-color" content="#101114">
<title>Slate</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="/icon-192.png">
<link rel="stylesheet" href="/static/typeface.css">
<link rel="stylesheet" href="/static/slate.css">
<script src="/static/typeface.js" defer></script>
</head>
<!-- face is applied before anything paints -->
<body>

<!-- The way off this page. -->
<div id="away">
  <a id="back" href="/board" title="back to the board">‹ board</a>
  <!-- A CANVAS (a session whose view is slate): its title; "Save to…", which
       binds it to a course or project (POST /bind) and files its pages there,
       neither ending it nor waking a tutor; "Give to the tutor", after a
       second tap, which hands every page over in one turn (POST /give); and
       End, which asks how it ends. -->
  <span id="notes-name" hidden></span>
  <button id="canvas-save" class="away-btn" type="button" hidden
          title="file these pages in a course or project; the canvas stays open">Save to…</button>
  <button id="canvas-give" class="away-btn" type="button" hidden
          title="hand every page to the tutor: one turn reads them all">Give to the tutor</button>
  <button id="notes-end" class="away-btn" type="button" hidden
          title="end the canvas: keep the pages, have them transcribed, or leave them unfiled">End</button>
</div>
<!-- HOW A CANVAS ENDS: its pages kept in the library with no turn, kept and
     transcribed into the notes.md beside them, or (bound to nothing) left
     unfiled in the session. -->
<div id="canvas-end" class="notes-send" hidden>
  <p class="notes-send-head">End this canvas</p>
  <button type="button" data-end="keep">End, keep the pages
    <span class="canvas-end-sub">in the library, with no turn</span></button>
  <button type="button" data-end="transcribe">End and transcribe
    <span class="canvas-end-sub">the tutor writes the text under each page</span></button>
  <button type="button" data-end="unfiled" id="canvas-end-unfiled">Keep it unfiled
    <span class="canvas-end-sub">no turn; the pages stay in the session</span></button>
  <div class="notes-send-acts">
    <button id="canvas-end-back" type="button">not yet</button>
  </div>
</div>
<!-- WHERE A CANVAS GOES, in the one picker order: Random lessons, Recent,
     Courses, Projects, and a new one. From "Save to…" a tap binds it there;
     from End a tap ends it into that subject (POST /end {subject,
     transcribe}), and "keep it unfiled" ends it with no turn, the pages left
     in the session. -->
<div id="notes-send" class="notes-send" hidden>
  <p class="notes-send-head" id="notes-send-head">Send these notes to a course or project, then end</p>
  <div id="notes-send-list"></div>
  <div class="notes-send-new">
    <button id="notes-new-course" type="button">+ new course</button>
    <button id="notes-new-project" type="button">+ new project</button>
  </div>
  <div id="notes-send-form" class="notes-send-form" hidden>
    <input id="notes-send-name" type="text" autocomplete="off" placeholder="name">
    <button id="notes-send-go" type="button">make it, send them there and end</button>
  </div>
  <div class="notes-send-acts">
    <button id="notes-send-skip" type="button"
            title="end with no turn; the pages stay in the session">keep it unfiled</button>
    <button id="notes-send-back" type="button">not yet</button>
  </div>
  <p id="notes-send-said" class="notes-send-said"></p>
</div>
<div id="prompt" hidden><span class="kind"></span><span class="text"></span></div>
<div id="slate"></div>

<!-- Text fields the Apple Pencil cannot reach, so a finger always gets the
     full keyboard. First, before anything that focuses a field. -->
<script src="/static/keyguard.js"></script>
<!-- The clipboard is shared with the board's own writing surface and with the
     marks on the lesson, so copying here and pasting there is one clipboard and
     not three. Before slate-core.js, which reads it. -->
<script src="/static/ink-clip.js"></script>
<!-- What the hand is doing, and where the view is allowed to be. Read by
     slate-core.js and by the map; before both. -->
<script src="/static/plane-core.js"></script>
<!-- The geometry of a line of ink. Before slate-core.js, which reads it and
     refuses to load without it. -->
<script src="/static/ink-core.js"></script>
<script src="/static/slate-core.js"></script>
<script src="/static/slate.js"></script>
</body>
</html>
