<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Board">
<meta name="theme-color" content="#fbfaf7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16171a" media="(prefers-color-scheme: dark)">
<title>Board</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="/icon-192.png">
<link rel="stylesheet" href="/static/typeface.css">
<link rel="stylesheet" href="/static/home.css">
<script src="/static/typeface.js" defer></script>
</head>
<!-- face is applied before anything paints -->
<body>

<header id="bar">
  <div class="bar-left">
    <span id="dot" class="dot" title="connection"></span>
    <span class="wordmark">Board</span>
  </div>
  <div class="bar-right">
    <button id="btn-face" title="typeface">Aa</button>
    <button id="btn-theme" title="light / dark / auto">◐</button>
    <button id="btn-reload" title="reload the app">↻</button>
  </div>
</header>

<main>
  <section id="current" class="hero">
    <p class="eyebrow" id="hero-eyebrow">current</p>
    <h1 id="hero-course">…</h1>
    <p class="chapter" id="hero-chapter"></p>

    <p id="waiting" class="waiting" hidden>
      <span class="waiting-tag">your move</span>
      <span id="waiting-text"></span>
    </p>

    <div class="actions">
      <a class="action primary" href="/board">
        <span class="action-name">Continue the lesson</span>
        <span class="action-sub" id="hero-count"></span>
      </a>
      <a class="action" href="/slate">
        <span class="action-name">✎ Write</span>
        <span class="action-sub" id="hero-slate">the slate</span>
      </a>
    </div>
  </section>

  <!-- THE ATLAS. This used to be two lists -- "Other courses" and "Earlier" --
       and a list is not a map. The same objection that killed the first version
       of the per-workspace map applies to a column of names: "I don't want just
       a list of all the TODOs. I want a map of the CONTENT." So it is drawn.

       One plane, a region per family, a card per workspace, each card saying
       what is next in it and how much of it is outstanding. Tapping one opens
       the sheet; opening from there moves the board. -->
  <section id="atlas-wrap">
    <div class="atlas-head">
      <h2>Everything</h2>
      <div class="atlas-tools">
        <button id="atlas-fit" type="button" title="see all of it">fit</button>
      </div>
    </div>
    <div id="atlas-plane" class="atlas-plane">
      <svg id="atlas-svg" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
    <p id="atlas-empty" class="hint" hidden>Nothing to draw yet.</p>
  </section>

  <p id="where" class="where"></p>
</main>

<!-- One workspace, in full, because a card on a plane is a summary and the
     decision to open something deserves the whole of what is known. It is also
     the answer to reading a card on a phone: the picture can be small as long
     as a tap makes it large. -->
<div id="sheet" class="sheet" hidden>
  <div class="sheet-box" role="dialog" aria-modal="true" aria-labelledby="sheet-name">
    <p class="eyebrow" id="sheet-family"></p>
    <h3 id="sheet-name"></h3>
    <p class="sheet-line" id="sheet-where"></p>
    <p class="sheet-next" id="sheet-next" hidden>
      <span class="waiting-tag">next</span>
      <span id="sheet-next-text"></span>
    </p>
    <p class="sheet-line" id="sheet-meta"></p>
    <div class="sheet-actions">
      <button id="sheet-open" class="action primary" type="button">
        <span class="action-name">Open this</span>
        <span class="action-sub" id="sheet-open-sub"></span>
      </button>
      <button id="sheet-close" class="action" type="button">
        <span class="action-name">Not now</span>
      </button>
    </div>
  </div>
</div>

<!-- The switch overlay. It used to be a word and a 700ms timer: the page said
     "moving the board…", reloaded, and landed back on the course you had just
     tapped away from, because the address had not moved yet and nothing was
     watching for it to. It now says what it is waiting for and waits for the
     thing itself. It asks nothing: a tap dismisses it. -->
<div id="busy" class="busy" hidden>
  <div class="busy-box">
    <p id="busy-text">opening…</p>
    <p id="busy-sub" class="busy-sub"></p>
  </div>
</div>

<script src="/static/address.js"></script>
<script src="/static/gauge.js"></script>
<script src="/static/plane-core.js"></script>
<script src="/static/home.js"></script>
</body>
</html>
