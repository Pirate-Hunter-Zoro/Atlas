<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Board">
<title>Meeting deck</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="/icon-192.png">
<link rel="stylesheet" href="/static/typeface.css">
<!-- The board's own sheet and the library's, unchanged. The reader here is the
     library's reader over a document that belongs to the repository rather
     than to a workspace, so it is the same bar, the same page boxes and the
     same pen -- a second set of either is a second thing to keep in step. -->
<link rel="stylesheet" href="/static/board.css">
<link rel="stylesheet" href="/static/reader.css">
<link rel="stylesheet" href="/static/library.css">
<script src="/static/typeface.js" defer></script>
</head>
<body>

<!-- ONE DECK, the artifact of projects/Meetings. The way back from here is the
     front door, and the bar is the one reader's own (`reader.js` adopts this
     markup) -- `#reader` is fixed to the whole viewport, and a second bar above
     it would be a header nothing can reach. -->
<div id="reader">
  <div id="reader-bar">
    <a id="deck-back" href="/" title="back to everything">‹ Everything</a>
    <strong id="reader-name">Meeting deck</strong>
    <span id="reader-sub" class="muted"></span>
    <span id="deck-count" class="muted"></span>
    <!-- THE PEN, ON THE SLIDE ITSELF. A mark here is feedback on the deck,
         like ink on any document in a library. -->
    <button id="reader-pen" type="button" title="draw on the slide">✎ mark it up</button>
    <!-- WHERE THE INK IS: saved and on how many slides, being saved, or not
         saved and being retried. The library reader's line, off the same
         save path (`inkkeep.js`). -->
    <span id="reader-kept" class="reader-kept" role="status" aria-live="polite" hidden></span>
    <button id="deck-send" type="button" title="your marks, and what you type, as a revision" disabled>
      say what is wrong</button>
    <a id="deck-pdf" href="/meeting/pdf" target="_blank" rel="noopener"
       title="the deck itself">⤓ the file</a>
    <!-- THE ZOOM, SAID ONLY WHEN IT IS NOT THE FIT, and a tap puts it back. -->
    <button id="reader-zoom" type="button" title="back to the page width" hidden>100%</button>
    <button id="reader-close" type="button" title="back to the front door">✕</button>
  </div>
  <!-- NOTHING THE READER CAN BE WAITING ON IS SILENT. Which slides are
       marked, what sending them will do, and what happened when it was done. -->
  <p id="reader-said" class="reader-said" hidden></p>
  <!-- INK KNOWS ITS BUILD. A deck recompiled in place moves its slides under
       the marks, and this says so. -->
  <p id="reader-rebuilt" class="reader-said reader-rebuilt" hidden></p>
  <!-- WHAT NO SOURCE SUPPORTS. Every number and figure on the deck is checked
       against the brief it was written over; what is not found is listed
       here, never silently dropped and never silently shipped. -->
  <details id="deck-check" class="reader-said" hidden>
    <summary id="deck-check-head"></summary>
    <ul id="deck-check-list"></ul>
  </details>
  <div id="reader-pages"></div>
</div>

<!-- SAYING WHAT IS WRONG, the library's way: the marks and the words go to
     `/library/feedback` as one round on the deck, and the deck's host tutor
     gets a [revise] turn that edits the deck or writes TUTOR.md, its choice. -->
<div id="note" hidden>
  <div id="note-box">
    <strong id="deck-ask-title">Say what is wrong with the deck</strong>
    <p id="deck-ask-list" class="muted"></p>
    <textarea id="deck-ask-text" rows="5"
      placeholder="What is wrong with it, or where the work should go next. Optional: the marks say it too."></textarea>
    <p id="deck-ask-said" class="note-said" hidden></p>
    <div id="note-acts">
      <button id="deck-ask-cancel" type="button" class="quiet">cancel</button>
      <button id="deck-ask-go" type="button" class="primary">send it</button>
    </div>
  </div>
</div>

<!-- The ink, and the clipboard it shares with the lesson's own pen. Both are
     the board's, unchanged: a page carries `data-ann` and `annotate.js` has
     taken that as an anchor since the viewer first drew one. -->
<script src="/static/ink-clip.js"></script>
<script src="/static/ink-core.js"></script>
<script src="/static/annotate.js"></script>
<script src="/static/annbar.js"></script>
<script src="/static/viewpin.js"></script>
<script src="/static/inkkeep.js"></script>
<script src="/static/recentre.js"></script>
<script src="/static/readerzoom.js"></script>
<script src="/static/reader.js"></script>
<script src="/static/meeting.js"></script>
</body>
</html>
